[package]
name = "qop-core"
version = "0.1.0"
edition = "2024"
authors = ["JazzerThighs <profenjb199@gmail.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
better_default = "1"
duplicate = "2"
lazy_static = "1"
nestify = "0.3"
serde = { version = "1", features = ["derive"] }
winit = { version = "0.30", optional = true }

[dev-dependencies]
serde_json = "1"
